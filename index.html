<!DOCTYPE html>
<html>
<head>
    <title>FAQ Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f2f5;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
        }
        .user {
            text-align: right;
            color: blue;
        }
        .bot {
            text-align: left;
            color: green;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <h3 class="text-center">🤖 FAQ Chatbot</h3>

    <div class="chat-box mb-3">
        {% for msg in chat %}
            <p class="{{ msg.type }}"><b>{{ msg.sender }}:</b> {{ msg.text }}</p>
        {% endfor %}
    </div>

    <form method="POST" class="d-flex">
        <input type="text" name="question" class="form-control" placeholder="Ask something..." required>
        <button class="btn btn-primary ms-2">Send</button>
    </form>

</div>

</body>
</html>
